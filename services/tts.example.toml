# SERVICE FILE of tts (default port 8002). Copy to services/tts.toml (git-ignored) to set what this service
# runs and its own settings in a file of its own. It is optional and more specific than robot.toml: a value here wins
# over the same value under [env.tts] of robot.toml, and only a machine's secrets/<machine>.env wins over this file.
#
# Which code to deploy: set at most one of branch, tag or commit. Without any, the service follows the branch of
# services.toml (or of the host file); `oblivion.py deploy|update --branch tts=<ref>` overrides it for one run.
#branch = 'feature_ai_claude_2'
#tag = 'v1.0.0'
#commit = '0123abc'
#
# A line that starts with `#NAME = value` is commented out and shows the default: uncomment and edit only what you want to
# change. A line without `#` is active: the secrets (keys) are listed empty. Generated by scripts/env_inventory.py.

[env]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
# Piper droid effect strength: 0 = off, 0.5 = light metal (default), 1 = obvious, 2 = maximum
#TTS_DROID_EFFECT = 0.5
# Engine: piper (neural voice, default) or pyttsx3 (the old Windows SAPI / espeak voice). If the Piper voice
# is missing or cannot load, the service logs an error and uses pyttsx3.
#TTS_ENGINE = 'piper'
# Folder holding <voice>.onnx and <voice>.onnx.json (relative to the service folder)
#TTS_PIPER_MODEL_DIR = 'models'
# Piper speaking speed multiplier (1.0 = the voice's own pace, 1.1 = a little brisker)
#TTS_PIPER_SPEED = 1.0
# Piper voice name. The deployment tool fetches it (scripts/fetch_voice.py, about 60 MB); by hand: python
# scripts/fetch_voice.py
#TTS_PIPER_VOICE = 'en_GB-alan-medium'
# Piper pitch lift in semitones (0 = the voice as recorded). The pace is kept
#TTS_PITCH_SEMITONES = 2.0
# pyttsx3 only: speech speed in words per minute
#TTS_SPEECH_RATE = 140
# pyttsx3 only: preferred voice, used if its name contains this text, otherwise the first English voice
#TTS_VOICE_NAME = 'Zira'
