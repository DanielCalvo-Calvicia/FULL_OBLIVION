# SERVICE FILE of speaker (default port 8003). Copy to services/speaker.toml (git-ignored) to set what this service
# runs and its own settings in a file of its own. It is optional and more specific than robot.toml: a value here wins
# over the same value under [env.speaker] of robot.toml, and only a machine's secrets/<machine>.env wins over this file.
#
# Which code to deploy: set at most one of branch, tag or commit. Without any, the service follows the branch of
# services.toml (or of the host file); `oblivion.py deploy|update --branch speaker=<ref>` overrides it for one run.
#branch = 'feature_ai_claude_2'
#tag = 'v1.0.0'
#commit = '0123abc'
#
# A line that starts with `#NAME = value` is commented out and shows the default: uncomment and edit only what you want to
# change. A line without `#` is active: the secrets (keys) are listed empty. Generated by scripts/env_inventory.py.

[env]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
# Also used by stepper: it can be set once under [env] of robot.toml. Comma-separated CORS origins
#ALLOWED_ORIGINS = '*'
# Leave blank to auto-detect an output device from the keywords below
#SPEAKER_DEVICE_INDEX = ""
#SPEAKER_DEVICE_KEYWORDS = 'i2s,hw,default,sysdefault'
