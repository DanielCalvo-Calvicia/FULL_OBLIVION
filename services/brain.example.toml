# SERVICE FILE of brain (default port 7999). Copy to services/brain.toml (git-ignored) to set what this service
# runs and its own settings in a file of its own. It is optional and more specific than robot.toml: a value here wins
# over the same value under [env.brain] of robot.toml, and only a machine's secrets/<machine>.env wins over this file.
#
# Which code to deploy: set at most one of branch, tag or commit. Without any, the service follows the branch of
# services.toml (or of the host file); `oblivion.py deploy|update --branch brain=<ref>` overrides it for one run.
#branch = 'feature_ai_claude_2'
#tag = 'v1.0.0'
#commit = '0123abc'
#
# A line that starts with `#NAME = value` is commented out and shows the default: uncomment and edit only what you want to
# change. A line without `#` is active: the secrets (keys) are listed empty. Generated by scripts/env_inventory.py.

[env]
# Computed by the deploy tool, not set here: AI_AGENT_BASE_URL MICROPHONE_BASE_URL SERVICE_HOST SERVICE_PORT SPEAKER_BASE_URL STEPPER_BASE_URL STT_BASE_URL TTS_BASE_URL
#AI_AGENT_FLOWS = 'conversation-flow,motion-flow'
#MICROSERVICE_READY_POLL_INTERVAL_SECONDS = 2
#PROGRESS_RECEIVED_MESSAGE = 'Message received.'
#PROGRESS_THINKING_INTERVAL_SECONDS = 2
#PROGRESS_THINKING_MESSAGE = 'Thinking.'
#STARTUP_PREFLIGHT_ENABLED = true
#STARTUP_PREFLIGHT_TIMEOUT_SECONDS = 60
#STEPPER_DEFAULT_RPM = 15
#STEPPER_LEFT_ARM_STEPPER_ID = 'stepper_1'
#STEPPER_RIGHT_ARM_STEPPER_ID = 'stepper_2'
