# SERVICE FILE of microphone (default port 8000). Copy to services/microphone.toml (git-ignored) to set what this service
# runs and its own settings in a file of its own. It is optional and more specific than robot.toml: a value here wins
# over the same value under [env.microphone] of robot.toml, and only a machine's secrets/<machine>.env wins over this file.
#
# Which code to deploy: set at most one of branch, tag or commit. Without any, the service follows the branch of
# services.toml (or of the host file); `oblivion.py deploy|update --branch microphone=<ref>` overrides it for one run.
#branch = 'feature_ai_claude_2'
#tag = 'v1.0.0'
#commit = '0123abc'
#
# A line that starts with `#NAME = value` is commented out and shows the default: uncomment and edit only what you want to
# change. A line without `#` is active: the secrets (keys) are listed empty. Generated by scripts/env_inventory.py.

[env]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
#MICROPHONE_FALLBACK_SAMPLE_RATE = 16000
#MICROPHONE_SHOW_METER = true
# Comma-separated device-name keywords; empty = OS default input
#MICROPHONE_TARGET_KEYWORDS = ""
