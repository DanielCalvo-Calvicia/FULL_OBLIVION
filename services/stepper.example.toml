# SERVICE FILE of stepper (default port 8005). Copy to services/stepper.toml (git-ignored) to set what this service
# runs and its own settings in a file of its own. It is optional and more specific than robot.toml: a value here wins
# over the same value under [env.stepper] of robot.toml, and only a machine's secrets/<machine>.env wins over this file.
#
# Which code to deploy: set at most one of branch, tag or commit. Without any, the service follows the branch of
# services.toml (or of the host file); `oblivion.py deploy|update --branch stepper=<ref>` overrides it for one run.
#branch = 'feature_ai_claude_2'
#tag = 'v1.0.0'
#commit = '0123abc'
#
# A line that starts with `#NAME = value` is commented out and shows the default: uncomment and edit only what you want to
# change. A line without `#` is active: the secrets (keys) are listed empty. Generated by scripts/env_inventory.py.

[env]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
# Also used by speaker: it can be set once under [env] of robot.toml. Inbound HTTP Configuration
#ALLOWED_ORIGINS = '*'
# Max speed constraint applied in the service layer if none provided (Steps per second)
#DEFAULT_SPEED_LIMIT = 1000.0
# Set to 1 to force the Mock Adapter even on a Raspberry Pi (services.toml presets MOCK_HARDWARE=1)
#MOCK_HARDWARE = 1
# Stepper Configuration (JSON) Define your steppers here with step, dir, and en pins (BCM numbering).
#STEPPER_CONFIGS = '{"stepper_1": {"step": 17, "dir": 27, "en": 5}, "stepper_2": {"step": 23, "dir": 24, "en": 25}}'
# Steps per full motor revolution (full steps x microsteps). Used by /rotate to convert "rotations" -> steps
# and "rpm" -> steps per second. Example: 1.8 deg/step motor = 200 full steps; with 1/8 ...
#STEPS_PER_REVOLUTION = 400
