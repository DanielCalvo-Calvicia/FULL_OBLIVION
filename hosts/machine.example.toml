# Per-machine OVERRIDES on top of the topology. Most machines need no host file at all: with robot.toml in place,
#   python3 oblivion.py deploy --host <machine>
# already knows the machine's services, the URL of every service on the other machines and its bind address.
# Add hosts/<machine>.toml (git-ignored) only to change something the topology does not say. Settings and keys do NOT go
# here: they go in robot.toml (the single file of truth: robot.example.toml lists every variable of every service).
[host]
machine = "server"                 # a machine of robot.toml
# python = "python3.12"            # when the default python3 is older than 3.12 (ai-agent needs 3.12+)
# workdir = "/opt/oblivion"        # default ~/oblivion: clones, virtualenvs, logs, state
# os = "raspberry"                 # only to force it: the OS and a Raspberry Pi are detected
# env_file = "secrets/other.env"   # default secrets/<machine>.env

[defaults]
branch = "feature_ai_claude"       # every service of this machine follows this branch unless it sets its own

# [services.stt]
# runtime = "docker"               # optional per service (not yet exercised)
# [services.tts]
# branch = "v1.2"                  # a tag, a branch or a commit for one service
