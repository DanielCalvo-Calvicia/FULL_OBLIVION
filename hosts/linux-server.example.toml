# A server (no sound card) running the "thinking" services. Audio lives on other machines, so Brain reaches
# the microphone and speaker through [remote]. The same file works on Windows: change os to "windows".
# ai-agent needs Python 3.12+ (Ubuntu 24.04 has it; Raspberry Pi OS Bookworm does not: tool refuses to install it).
#   python3 oblivion.py deploy --host linux-server --system-deps
[host]
name = "linux-server"
os = "linux"
workdir = "~/oblivion"                   # a normal user can write here; for /opt/oblivion create it first and chown it
bind = "127.0.0.1"                       # only Brain (here) calls these services; no authentication, so do not expose them
secrets = "secrets/linux-server.env"     # STT__OPENAI_API_KEY=..., AI_AGENT__GROQ_API_KEY=..., AI_AGENT__GOOGLE_API_KEY=...
# python = "python3.12"                  # when the default python3 is older than 3.12

[services.brain]
[services.ai-agent]                      # its LLM keys go in the secrets file as AI_AGENT__GROQ_API_KEY=...
[services.stt]
[services.stt.env]
STT_ENGINE = "openai"
STT_LANGUAGE = "en"
[services.tts]
# Docker is optional per service (runtime = "docker") but has not been exercised yet; native needs nothing extra.

[remote]
microphone = "http://192.168.1.20:8000"  # the Windows PC
speaker = "http://192.168.1.20:8003"
stepper = "http://192.168.1.30:8005"     # the Raspberry Pi with the motors (optional: without it the arms do not move)
