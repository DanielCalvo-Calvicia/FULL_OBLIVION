# The Raspberry Pi wired to the two arm motors: only the stepper runs here, and Brain (on another machine)
# reaches it over the network. This is the ONLY machine where the real GPIO driver may be used.
#   python3 oblivion.py deploy --host raspberry-stepper --system-deps
# Brain machine host file: [remote] stepper = "http://<this Pi's address>:8005"
[host]
name = "raspberry-stepper"
os = "raspberry"
workdir = "~/oblivion"
bind = "0.0.0.0"               # Brain on another machine must reach it. No authentication: trusted LAN only
python = "python3"             # Raspberry Pi OS Bookworm ships 3.11

[services.stepper]
[services.stepper.env]
MOCK_HARDWARE = "0"            # real motors. The first time, move a small angle with the arm unloaded
# STEPPER_CONFIGS = '{"stepper_1": {"step": 17, "dir": 27, "en": 5}, "stepper_2": {"step": 23, "dir": 24, "en": 25}}'   # your BCM wiring
# STEPS_PER_REVOLUTION = "400"  # full steps x microsteps of YOUR motor/driver: a wrong value moves the arm the wrong angle
