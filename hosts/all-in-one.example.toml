# One machine runs every service: the simplest setup, for a PC where you develop or try the whole flow.
# `python launch.py` creates and uses hosts/local.toml for you; this file is the same thing written by hand:
#   python oblivion.py deploy --host all-in-one
# Ports and URLs come from services.toml (Brain finds the others on 127.0.0.1), the LLM endpoints too. Settings and
# keys go in the machine env file below (or use robot.toml, the single file of truth: robot.example.toml).
[host]
name = "all-in-one"
env_file = "secrets/all-in-one.env"
# workdir = "~/oblivion"           # clones, virtualenvs, logs and state live here
# bind = "127.0.0.1"               # the default: nothing is reachable from other machines

[services.microphone]
[services.stt]
[services.tts]
[services.speaker]
[services.ai-agent]                # needs an LLM key in the env file, and Python 3.12+
[services.stepper]                 # simulated unless STEPPER__MOCK_HARDWARE=0 in the env file (only on the Pi wired to motors)
[services.brain]
