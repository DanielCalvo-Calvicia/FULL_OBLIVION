# Try a branch without touching production: the same all-in-one layout but on other ports, in its own
# workdir, with a feature branch for every service (or for some of them).
#   python oblivion.py deploy --host test-branch
#   python oblivion.py update --host test-branch --branch brain=feature_ai_claude
[host]
name = "test-branch"
workdir = "~/oblivion-test"

[defaults]
branch = "feature_ai_claude"   # every service below follows this branch unless it sets its own

[services.microphone]
port = 18000
[services.stt]
port = 18001
[services.tts]
port = 18002
[services.speaker]
port = 18003
[services.ai-agent]
port = 17998
[services.stepper]
port = 18005
[services.brain]
port = 18999
branch = "feature_ai_claude"
