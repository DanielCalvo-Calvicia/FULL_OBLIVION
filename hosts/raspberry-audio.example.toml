# A Raspberry Pi with a USB microphone and a speaker/DAC: both audio services run natively on it.
# (There is no microphone requirements file for Linux yet; the Windows one is used with a warning.)
[host]
name = "raspberry-audio"
os = "raspberry"
workdir = "~/oblivion"
bind = "0.0.0.0"
python = "python3"

[services.microphone]
[services.microphone.env]
MICROPHONE_TARGET_KEYWORDS = "usb,hw"

[services.speaker]
[services.speaker.env]
SPEAKER_DEVICE_KEYWORDS = "i2s,hw"
