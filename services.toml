# The catalogue of OBLIVION services: what each one is and how it is installed and run.
#
# This file describes SERVICES, not machines. Which services run on which machine, which branch,
# and every per-machine setting lives in hosts/<machine>.toml. To add a service to the platform,
# add a [services.<name>] table here (git URL, port, entry point, requirements files, ...).

# Shared libraries the services import but that are not inside the service repos. Each machine needs
# them installed into the service's virtualenv. Sources, tried in this order (the first usable one wins):
#   path      a local checkout (relative paths are relative to this file): the workspace, so a developer
#             machine always installs the current source
#   wheel_dir a folder with pre-built wheels (relative to this file). "wheels/" ships inside this repository,
#             so a fresh machine that only cloned it gets the library; refresh it with
#             scripts/bundle_shared_logging.py after changing shared-logging
#   git       a git URL, optionally with @ref, once the library has a repository of its own
[libraries.shared-logging]
path = "../shared-logging"
wheel_dir = "wheels"
# git = "https://github.com/DanielCalvo-Calvicia/shared-logging.git@main"

# ---------------------------------------------------------------------------------------------
# Common keys of [services.<name>]
#   git               repository to clone
#   branch            default branch/tag/commit (a host file or --branch can override it). It is
#                     feature_ai_claude_2 because the vendored contracts wheel every service needs is not on
#                     main yet: change it to main once the branches are merged
#   port              default HTTP port (SERVICE_PORT)
#   health / ready    endpoints checked after start ("ready" is optional)
#   entry             script started with the service's virtualenv python
#   requirements      requirements file per OS family: windows, linux, and optionally raspberry (used on a
#                     Raspberry Pi instead of linux); when the OS has no file, the other one is used with a warning
#   libraries         shared libraries to install after the requirements
#   prepare           script (plus arguments, relative to the service folder) run with the service's python after its
#                     .env is written, for what cannot ship in git or pip (tts: the Piper voice). A failure only
#                     warns. Docker images run it while building, with the default settings
#   apt               Debian/Raspberry Pi OS packages needed by the service (--system-deps)
#   audio             needs a sound device: cannot run in Docker on Windows
#   consumes          services this one calls -> env var that receives their base URL
#   optional_consumes consumed services that may be absent
#   min_python        oldest Python its pinned dependencies install on (checked before anything is installed)
#   require_any       at least one of these variables should be set (a warning, not an error)
#   internal          wiring constants and development switches whose defaults suit every deployment (globs): accepted,
#                     but not advertised in secrets/example.env or the manual
#   extra_env         variables the code reads that no .env.example lists (globs): known to `validate`, so setting
#                     them in the machine env file is not flagged as a typo
#   dotenv            true (default): the service loads the .env in its own folder itself, and that file is its only
#                     source of settings. false: the service does not read a .env, so oblivion/service_runner.py
#                     reads the file and starts the service (settings still never come from the environment)
#   [env]             default environment values for this service
#   [[require]]       env key that must be set (optionally only when other keys have some value)
# ---------------------------------------------------------------------------------------------

[services.brain]
git = "https://github.com/DanielCalvo-Calvicia/brain_microservice.git"
branch = "feature_ai_claude_2"
port = 7999
libraries = ["shared-logging"]
requirements = { windows = "requirements.windows.txt", linux = "requirements.linux.txt" }
consumes = { microphone = "MICROPHONE_BASE_URL", stt = "STT_BASE_URL", tts = "TTS_BASE_URL", speaker = "SPEAKER_BASE_URL", ai-agent = "AI_AGENT_BASE_URL", stepper = "STEPPER_BASE_URL" }
# Brain starts without the stepper (arm movement is then skipped) and answers with an apology while
# ai-agent is unreachable, but a production layout should run both.
optional_consumes = ["stepper"]
# Route paths of the other services (their contract, not a setting), what the brain calls itself, and development switches.
internal = ["*_ENDPOINT", "STEPPER_ROTATE_ENDPOINT_TEMPLATE", "PROVIDER_NAME", "PROVIDER_TIMEOUT_SECONDS", "VSCODE_*", "RUN_LIVE_MICROSERVICE_TESTS"]

[services.microphone]
git = "https://github.com/DanielCalvo-Calvicia/microphone_microservice.git"
branch = "feature_ai_claude_2"
port = 8000
ready = "/available"
audio = true
libraries = ["shared-logging"]
requirements = { windows = "requirements.windows.txt", linux = "requirements.linux.txt" }
apt = ["libportaudio2", "portaudio19-dev"]
dotenv = false   # microphone_microservice has no python-dotenv yet; set true once its main_flow/http.py loads the .env

[services.stt]
git = "https://github.com/DanielCalvo-Calvicia/stt_microservice.git"
branch = "feature_ai_claude_2"
port = 8001
ready = "/available"
libraries = ["shared-logging"]
requirements = { windows = "requirements.windows.txt", linux = "requirements.linux.txt" }
[services.stt.env]
STT_ENGINE = "openai"
[[services.stt.require]]
key = "OPENAI_API_KEY"
when = { STT_ENGINE = "openai" }

[services.tts]
git = "https://github.com/DanielCalvo-Calvicia/tts_microservice.git"
branch = "feature_ai_claude_2"
port = 8002
ready = "/available"
libraries = ["shared-logging"]
requirements = { windows = "requirements.windows.txt", linux = "requirements.linux.txt" }
apt = ["espeak", "espeak-data", "libespeak1"]   # the pyttsx3 fallback voice; Piper brings its own espeak-ng
# Fetches the Piper voice (about 60 MB, not in git or pip) the .env asks for; the service falls back to pyttsx3 without it
prepare = ["scripts/fetch_voice.py"]

[services.speaker]
git = "https://github.com/DanielCalvo-Calvicia/speaker_microservice.git"
branch = "feature_ai_claude_2"
port = 8003
ready = "/available"
audio = true
libraries = ["shared-logging"]
requirements = { windows = "requirements.windows.txt", linux = "requirements.linux.txt" }
apt = ["libportaudio2", "portaudio19-dev", "libsndfile1"]

[services.stepper]
git = "https://github.com/DanielCalvo-Calvicia/stepper_microservice.git"
branch = "feature_ai_claude_2"
port = 8005
libraries = ["shared-logging"]
# The Linux file pins RPi.GPIO, which only builds on a Raspberry Pi (and needs a compiler there). Any other
# Linux runs the mock adapter, so it uses the Windows file, which has no GPIO library.
requirements = { windows = "requirements.windows.txt", linux = "requirements.windows.txt", raspberry = "requirements.linux.txt" }
apt = ["build-essential", "python3-dev"]   # to build RPi.GPIO on the Pi
internal = ["VSCODE_*"]   # read by the shared logging package (development only), not in its .env.example
[services.stepper.env]
# The stepper compares this to the string "1" and nothing else: "true" would NOT select the mock, and on a
# Raspberry Pi it would drive the real motors. Real GPIO only on the machine wired to them: set "0" in that host file.
MOCK_HARDWARE = "1"

# The decision maker: turns what the user said into a reply and, when asked, an arm movement. It only
# decides; it never drives hardware. It reads AI_AGENT_HOST/AI_AGENT_PORT (not SERVICE_*), loads its own
# .env from its folder and needs at least one LLM provider key (see docs/DEPLOYMENT.md, "ai-agent").
[services.ai-agent]
git = "https://github.com/DanielCalvo-Calvicia/ai-agent.git"
branch = "feature_ai_claude_2"
port = 7998
ready = "/available"           # reports is_available=false until an LLM provider key or OLLAMA_URL is configured
folder = "ai-agent"
entry = "composition_root/main.py"
host_var = "AI_AGENT_HOST"
port_var = "AI_AGENT_PORT"
libraries = ["shared-logging"]
requirements = { windows = "requirements.txt", linux = "requirements.txt" }
min_python = "3.12"            # ai-sdk-python (pinned) does not install on 3.11, the Python of Raspberry Pi OS Bookworm
# Without any provider it answers /available with is_available=false. Default profile: Groq and Google.
extra_env = ["AI_AGENT_MODELS_FILE", "AI_AGENT_MODEL_PHASE_*", "GITHUB_API_KEY"]
require_any = ["GROQ_API_KEY", "GOOGLE_API_KEY", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "MISTRAL_API_KEY", "COHERE_API_KEY", "GITHUB_PAT", "GITHUB_API_KEY", "OLLAMA_URL"]
[services.ai-agent.env]
AI_AGENT_RELOAD = "0"          # the development auto-reloader has no place in a deployed service
# Public OpenAI-compatible endpoints of the providers of the default profile (not secrets; only the keys are).
# Without them the default profile cannot reach Groq/Google even when the keys are present.
GROQ_URL = "https://api.groq.com/openai/v1"
GOOGLE_URL = "https://generativelanguage.googleapis.com/v1beta/openai/"
