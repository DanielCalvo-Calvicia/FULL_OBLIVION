# SETTINGS OF BRAIN (default port 7999). One file per service: which code it runs and its own settings.
#
# This is the project's default and is committed: every line is commented out and shows the default. Uncomment and edit a line
# here to change it for everyone; put YOUR values and every key in config/local/brain.toml (git-ignored, same shape, wins
# over this file). Settings several services share are in config/services/all.toml.
#
# Which code to deploy: set at most one of branch, tag or commit. `oblivion.py deploy|update --branch brain=<ref>`
# overrides it for one run.
#branch = 'feature_ai_claude_2'
#tag = 'v1.0.0'
#commit = '0123abc'
#
# How it runs: native (a process of this machine) or docker. A port only to deviate from the catalogue; git only to deploy
# another repository or a local checkout.
#runtime = "native"
#port = 7999
#git = 'https://github.com/you/fork.git'
#
# Generated by scripts/env_inventory.py from the service's .env.example and source code. Do not edit the structure by hand.

[env]
# Computed by the deploy tool, not set here: AI_AGENT_BASE_URL MICROPHONE_BASE_URL SERVICE_HOST SERVICE_PORT SPEAKER_BASE_URL STEPPER_BASE_URL STT_BASE_URL TTS_BASE_URL
#AI_AGENT_FLOWS = 'conversation-flow,motion-flow'
# The robot's own voice comes back through the microphone. An utterance captured while the robot was speaking,
# or in the ECHO_GUARD_SECONDS after it (the sound dying away), is dropped before STT: ...
#ECHO_GUARD_SECONDS = 1.5
#MICROSERVICE_READY_POLL_INTERVAL_SECONDS = 2
#PROGRESS_RECEIVED_MESSAGE = 'Message received.'
#PROGRESS_THINKING_INTERVAL_SECONDS = 2
#PROGRESS_THINKING_MESSAGE = 'Thinking.'
#STARTUP_PREFLIGHT_ENABLED = true
#STARTUP_PREFLIGHT_TIMEOUT_SECONDS = 60
#STEPPER_DEFAULT_RPM = 15
#STEPPER_LEFT_ARM_STEPPER_ID = 'stepper_1'
#STEPPER_RIGHT_ARM_STEPPER_ID = 'stepper_2'
#STT_GATE_PATH_PREFIX = '/gate'
#WAKE_ACK_MESSAGE = 'Yes?'
# When an agent asks a question, its answer is taken without the phrase (once) within WAKE_ANSWER_SECONDS (0 =
# off).
#WAKE_ANSWER_SECONDS = 45
#WAKE_FOLLOWUP_SECONDS = 15
#WAKE_NAME_SIMILARITY = 0.75
#WAKE_PHRASE = 'Oblivion 306'
#WAKE_PHRASE_ENABLED = 0
# 1 = the local gate listens (needs STT_GATE_ENABLED=1 in the STT service). 0 = no local engine: the real STT
# transcribes every utterance (it costs tokens each time) and the phrase is read in its text.
#WAKE_USE_GATE_STT = 1
