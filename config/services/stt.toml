# SETTINGS OF STT (default port 8001). One file per service: which code it runs and its own settings.
#
# This is the project's default and is committed: every line is commented out and shows the default. Uncomment and edit a line
# here to change it for everyone; put YOUR values and every key in config/local/stt.toml (git-ignored, same shape, wins
# over this file). Settings several services share are in config/services/all.toml.
#
# Which code to deploy: set at most one of branch, tag or commit. `oblivion.py deploy|update --branch stt=<ref>`
# overrides it for one run.
#branch = 'feature_ai_claude_2'
#tag = 'v1.0.0'
#commit = '0123abc'
#
# How it runs: native (a process of this machine) or docker. A port only to deviate from the catalogue; git only to deploy
# another repository or a local checkout.
#runtime = "native"
#port = 8001
#git = 'https://github.com/you/fork.git'
#
# Generated by scripts/env_inventory.py from the service's .env.example and source code. Do not edit the structure by hand.

[env]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
# Shared with other services, so they are in config/services/all.toml: OPENAI_API_KEY
# "openai" = OpenAI Whisper API; any other value (e.g. "local") = local faster-whisper (catalogue.toml presets
# STT_ENGINE=openai)
#STT_ENGINE = 'openai'
# 1 = also run a small LOCAL speech-to-text (free: no tokens) on routes under /gate. Brain listens there for
# the wake phrase and only sends the utterances that carry it to the real engine above. ...
#STT_GATE_ENABLED = 0
# faster-whisper model of the gate: tiny.en is the fastest, base.en is more accurate (English only)
#STT_GATE_MODEL = 'tiny.en'
# Text that biases the gate's model toward the wake phrase (use the same words as Brain's WAKE_PHRASE)
#STT_GATE_PROMPT = 'Oblivion 306'
# ISO-639-1 code forced on the transcription, e.g. "en" or "es"
#STT_LANGUAGE = 'en'
# OpenAI engine only: words the model should spell as written here (e.g. the wake phrase "Oblivion 306"),
# which stops it writing "Obi-Wan 306". Empty = no hint. Check it does not make silence come ...
#STT_PROMPT = ""
