# SETTINGS SHARED BY SEVERAL SERVICES. A value here reaches every service that uses the variable and no other (a log level
# every service reads, the OpenAI key STT and ai-agent both need). A service's own file wins over this one.
#
# This is the project's default and is committed: every line is commented out and shows the default. Put YOUR values and every
# key in config/local/all.toml (git-ignored, same shape, wins over this file).
#
# Generated by scripts/env_inventory.py from the services' .env.example files and source code. Do not edit the structure by hand.

[env]
# Shared logging (every service):
# TRACE, DEBUG, INFO, WARNING, ERROR or CRITICAL
#LOG_LEVEL = 'INFO'
# json (machine-readable) or console (key=value lines for people)
#LOG_FORMAT = 'json'
# stdout, stderr or a file path
#LOG_OUTPUT = 'stdout'
# development, staging or production: the label on every log line and span
#APP_ENV = 'development'
# same as APP_ENV and wins over it when both are set
#ENVIRONMENT = ""
# send trace spans to a collector
#TRACE_EXPORT_ENABLED = false
# endpoint that receives the spans (enabled without a URL stays disabled)
#TRACE_EXPORT_URL = ""
# extra request headers, Name=value,Name2=value2 (may carry a credential)
# SECRET: put it in config/local/all.toml, not in this committed file.
#TRACE_EXPORT_HEADERS = ""
# extra span attribute names allowed to leave the process, comma separated
#TRACE_EXPORT_ATTRIBUTES = ""

# Used by several services, so set once here instead of once per service:
# Used by speaker, stepper, camera. Comma-separated CORS origins
#ALLOWED_ORIGINS = '*'
# Used by stt, ai-agent. Required when STT_ENGINE=openai
# SECRET: put it in config/local/all.toml, not in this committed file.
#OPENAI_API_KEY = ""
