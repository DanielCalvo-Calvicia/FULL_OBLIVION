# SETTINGS OF CAMERA (default port 8006). One file per service: which code it runs and its own settings.
#
# This is the project's default and is committed: every line is commented out and shows the default. Uncomment and edit a line
# here to change it for everyone; put YOUR values and every key in config/local/camera.toml (git-ignored, same shape, wins
# over this file). Settings several services share are in config/services/all.toml.
#
# Which code to deploy: set at most one of branch, tag or commit. `oblivion.py deploy|update --branch camera=<ref>`
# overrides it for one run.
#branch = 'feature_ai_claude_2'
#tag = 'v1.0.0'
#commit = '0123abc'
#
# How it runs: native (a process of this machine) or docker. A port only to deviate from the catalogue; git only to deploy
# another repository or a local checkout.
#runtime = "native"
#port = 8006
#git = 'https://github.com/you/fork.git'
#
# Generated by scripts/env_inventory.py from the service's .env.example and source code. Do not edit the structure by hand.

[env]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
# Shared with other services, so they are in config/services/all.toml: ALLOWED_ORIGINS
#CAMERA_ADAPTIVE = true
# REQUIRED when CAMERA_AUTH_MODE=api_key. role:key pairs, roles viewer | operator | admin. Generate real
# secrets; never commit them.
# SECRET: put it in config/local/camera.toml, not in this committed file.
#CAMERA_API_KEYS = ""
# api_key (default) or none. "none" is for isolated development and is refused on non-loopback hosts.
#CAMERA_AUTH_MODE = 'api_key'
# auto (libcamera then v4l2) | libcamera | v4l2 | fake
#CAMERA_BACKEND = 'auto'
#CAMERA_CLIENT_QUEUE_SIZE = 2
# Optional TOML file (see configs/camera.example.toml). Environment variables win over the file.
#CAMERA_CONFIG_FILE = ""
#CAMERA_DOCS_ENABLED = true
#CAMERA_ENABLED = true
#CAMERA_ID = 'front'
#CAMERA_IDLE_GRACE_SECONDS = 10
# keep_camera_running | stop_unused_streams | stop_all_streams
#CAMERA_IDLE_POLICY = 'keep_camera_running'
#CAMERA_MAX_CAMERAS = 4
#CAMERA_MAX_CLIENTS_PER_STREAM = 10
#CAMERA_MAX_CPU_PERCENT = 80
#CAMERA_MAX_DISK_PERCENT = 90
#CAMERA_MAX_MEMORY_PERCENT = 80
# sum of width*height*fps over active streams (1080p30 + 720p15 is about 76 million)
#CAMERA_MAX_PIXEL_RATE = 80000000
#CAMERA_MAX_REQUEST_BYTES = 65536
#CAMERA_MAX_STREAMS_PER_CAMERA = 4
#CAMERA_MAX_TEMPERATURE_C = 75
# bit/s actually sent to clients; 0 disables
#CAMERA_MAX_TOTAL_BITRATE = 12000000
#CAMERA_METRICS_ENABLED = true
#CAMERA_MIN_FPS_RATIO = 0.3
#CAMERA_MQTT_ENABLED = false
# true: pick the nearest valid stream configuration and report it; false: answer 422
#CAMERA_NEGOTIATE = false
#CAMERA_NO_FRAME_TIMEOUT_SECONDS = 3
#CAMERA_RATE_LIMIT_CONTROL_PER_MIN = 30
#CAMERA_RATE_LIMIT_READ_PER_MIN = 600
#CAMERA_RECOVERY_BASE_SECONDS = 1
#CAMERA_RECOVERY_MAX_SECONDS = 60
#CAMERA_REDISCOVER_INTERVAL_SECONDS = 10
#CAMERA_RESOURCE_INTERVAL_SECONDS = 2
#CAMERA_RESOURCE_SUSTAIN_TICKS = 3
#CAMERA_ROBOT_ID = 'robot'
#CAMERA_SHUTDOWN_TIMEOUT_SECONDS = 10
# Where profiles, stream definitions, camera config and calibration are kept (atomic writes).
#CAMERA_STATE_DIR = './data'
# TLS (certificate and key files); leave blank to serve plain HTTP behind a trusted network/proxy
#CAMERA_TLS_CERTFILE = ""
# SECRET: put it in config/local/camera.toml, not in this committed file.
#CAMERA_TLS_KEYFILE = ""
#CAMERA_VERIFY_TIMEOUT_SECONDS = 5
#CAMERA_WATCHDOG_INTERVAL_SECONDS = 1
