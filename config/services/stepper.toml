# SETTINGS OF STEPPER (default port 8005). One file per service: which code it runs and its own settings.
#
# This is the project's default and is committed: every line is commented out and shows the default. Uncomment and edit a line
# here to change it for everyone; put YOUR values and every key in config/local/stepper.toml (git-ignored, same shape, wins
# over this file). Settings several services share are in config/services/all.toml.
#
# Which code to deploy: set at most one of branch, tag or commit. `oblivion.py deploy|update --branch stepper=<ref>`
# overrides it for one run.
#branch = 'feature_ai_claude_2'
#tag = 'v1.0.0'
#commit = '0123abc'
#
# How it runs: native (a process of this machine) or docker. A port only to deviate from the catalogue; git only to deploy
# another repository or a local checkout.
#runtime = "native"
#port = 8005
#git = 'https://github.com/you/fork.git'
#
# Generated by scripts/env_inventory.py from the service's .env.example and source code. Do not edit the structure by hand.

[env]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
# Shared with other services, so they are in config/services/all.toml: ALLOWED_ORIGINS
# Max speed constraint applied in the service layer if none provided (Steps per second)
#DEFAULT_SPEED_LIMIT = 1000.0
# Set to 1 to force the Mock Adapter even on a Raspberry Pi (catalogue.toml presets MOCK_HARDWARE=1)
#MOCK_HARDWARE = 1
# Stepper Configuration (JSON) Define your steppers here with step, dir, and en pins (BCM numbering).
#STEPPER_CONFIGS = '{"stepper_1": {"step": 17, "dir": 27, "en": 5}, "stepper_2": {"step": 23, "dir": 24, "en": 25}}'
# Steps per full motor revolution (full steps x microsteps). Used by /rotate to convert "rotations" -> steps
# and "rpm" -> steps per second. Example: 1.8 deg/step motor = 200 full steps; with 1/8 ...
#STEPS_PER_REVOLUTION = 400
