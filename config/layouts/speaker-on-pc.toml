# SPEAKER ON THE PC, EVERYTHING ELSE ON THE PI.
#   pc  the Windows PC whose speakers play the robot's voice
#   pi  the Raspberry Pi: microphone, the whole pipeline, the AI agent and the motors
#
# Use it:  layout = "speaker-on-pc"  in config/robot.toml, with the address of each machine under [addresses].
# ai-agent needs Python 3.12 or newer: stock Raspberry Pi OS Bookworm has 3.11, so install a newer Python on the Pi
# and name it in config/machines/pi.toml (python = "...").
description = "Speaker on the PC; microphone, brain, stt, tts, ai-agent and stepper on the Pi."

[machines.pc]
services = ["speaker"]

[machines.pi]
services = ["brain", "microphone", "stt", "tts", "ai-agent", "stepper", "camera"]
