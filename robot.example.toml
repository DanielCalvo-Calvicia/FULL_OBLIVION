# ROBOT: the single file of truth of the OBLIVION deployment. Copy to robot.toml (git-ignored), fill it in, and put the
# same file on every machine. It holds the layout AND every setting and key of every service.
#
#   [machines.<name>]   where each machine is and which services run there. That is all a machine needs: the port of each
#                       service is in services.toml, the URL of every service on another machine, each machine's bind
#                       address and every SERVICE_HOST / SERVICE_PORT / *_BASE_URL are derived (`oblivion.py topology`).
#   [env]               a variable once, for every service that uses it (a log level, an OpenAI key STT and ai-agent share).
#   [env.<service>]     one service's own variables. It wins over [env]. Each service runs on exactly one machine, so
#                       nothing here is per machine.
#
# A line that starts with `#NAME = value` is commented out and shows the default: uncomment and edit only what you want to
# change. A line without `#` is active: the secrets (keys) are listed empty, fill in the ones you use. Values may be strings,
# numbers or true/false. Only the settings worth changing are listed: the routes between services, service names, tuning
# knobs and development switches keep their defaults.
#
# Keys in this file reach every machine you copy it to. To keep a key off a machine, leave it out of the copy that machine
# gets and put it in that machine's own secrets/<machine>.env instead (lines NAME=value as SERVICE__NAME=value, or
# ALL__NAME=value), which wins over this file.
#
# Generated by scripts/env_inventory.py from the services' .env.example files and source code. Do not edit the
# structure by hand: run the script (tests fail when this file no longer lists everything the services read).

# ================================================================================================
# THE ROBOT: machines and where the services run (every service on exactly one machine)
# ================================================================================================
[machines.pc]                      # the Windows PC with the sound card
address = "192.168.1.20"           # an IP or a host name: no http://, no port
services = ["microphone", "speaker"]

[machines.server]                  # brain and everything that thinks (Python 3.12+ for ai-agent)
address = "192.168.1.10"
services = ["brain", "ai-agent", "stt", "tts"]

[machines.pi]                      # the Raspberry Pi wired to the motors (MOCK_HARDWARE = 0 under [env.stepper] for real motors)
address = "192.168.1.30"
services = ["stepper"]
# ports = { stepper = 18005 }      # a machine's ports = {..} only to deviate from services.toml; every caller follows

# ================================================================================================
# [env]: one value for every service that uses the variable
# ================================================================================================
[env]
# Shared logging (every service):
# TRACE, DEBUG, INFO, WARNING, ERROR or CRITICAL
#LOG_LEVEL = 'INFO'
# json (machine-readable) or console (key=value lines for people)
#LOG_FORMAT = 'json'
# stdout, stderr or a file path
#LOG_OUTPUT = 'stdout'
# development, staging or production: the label on every log line and span
#APP_ENV = 'development'
# same as APP_ENV and wins over it when both are set
#ENVIRONMENT = ""
# send trace spans to a collector
#TRACE_EXPORT_ENABLED = false
# endpoint that receives the spans (enabled without a URL stays disabled)
#TRACE_EXPORT_URL = ""
# extra request headers, Name=value,Name2=value2 (may carry a credential)
TRACE_EXPORT_HEADERS = ""
# extra span attribute names allowed to leave the process, comma separated
#TRACE_EXPORT_ATTRIBUTES = ""

# Used by several services, so set once here instead of once per service:
# used by speaker, stepper. Comma-separated CORS origins
#ALLOWED_ORIGINS = '*'
# used by stt, ai-agent. Required when STT_ENGINE=openai
OPENAI_API_KEY = ""

# ================================================================================================
# [env.brain]   default port 7999
# ================================================================================================
[env.brain]
# Computed by the deploy tool, not set here: AI_AGENT_BASE_URL MICROPHONE_BASE_URL SERVICE_HOST SERVICE_PORT SPEAKER_BASE_URL STEPPER_BASE_URL STT_BASE_URL TTS_BASE_URL
#AI_AGENT_FLOWS = 'conversation-flow,motion-flow'
#MICROSERVICE_READY_POLL_INTERVAL_SECONDS = 2
#PROGRESS_RECEIVED_MESSAGE = 'Message received.'
#PROGRESS_THINKING_INTERVAL_SECONDS = 2
#PROGRESS_THINKING_MESSAGE = 'Thinking.'
#STARTUP_PREFLIGHT_ENABLED = true
#STARTUP_PREFLIGHT_TIMEOUT_SECONDS = 60
#STEPPER_DEFAULT_RPM = 15
#STEPPER_LEFT_ARM_STEPPER_ID = 'stepper_1'
#STEPPER_RIGHT_ARM_STEPPER_ID = 'stepper_2'

# ================================================================================================
# [env.microphone]   default port 8000
# ================================================================================================
[env.microphone]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
#MICROPHONE_FALLBACK_SAMPLE_RATE = 16000
#MICROPHONE_SHOW_METER = true
# Comma-separated device-name keywords; empty = OS default input
#MICROPHONE_TARGET_KEYWORDS = ""

# ================================================================================================
# [env.stt]   default port 8001
# ================================================================================================
[env.stt]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
# "openai" = OpenAI Whisper API; any other value (e.g. "local") = local faster-whisper (services.toml presets
# STT_ENGINE=openai)
#STT_ENGINE = 'openai'
# ISO-639-1 code forced on the transcription, e.g. "en" or "es"
#STT_LANGUAGE = 'en'

# ================================================================================================
# [env.tts]   default port 8002
# ================================================================================================
[env.tts]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
# Piper droid effect strength: 0 = off, 0.5 = light metal (default), 1 = obvious, 2 = maximum
#TTS_DROID_EFFECT = 0.5
# Engine: piper (neural voice, default) or pyttsx3 (the old Windows SAPI / espeak voice). If the Piper voice
# is missing or cannot load, the service logs an error and uses pyttsx3.
#TTS_ENGINE = 'piper'
# Folder holding <voice>.onnx and <voice>.onnx.json (relative to the service folder)
#TTS_PIPER_MODEL_DIR = 'models'
# Piper speaking speed multiplier (1.0 = the voice's own pace, 1.1 = a little brisker)
#TTS_PIPER_SPEED = 1.0
# Piper voice name. The deployment tool fetches it (scripts/fetch_voice.py, about 60 MB); by hand: python
# scripts/fetch_voice.py
#TTS_PIPER_VOICE = 'en_GB-alan-medium'
# Piper pitch lift in semitones (0 = the voice as recorded). The pace is kept
#TTS_PITCH_SEMITONES = 2.0
# pyttsx3 only: speech speed in words per minute
#TTS_SPEECH_RATE = 140
# pyttsx3 only: preferred voice, used if its name contains this text, otherwise the first English voice
#TTS_VOICE_NAME = 'Zira'

# ================================================================================================
# [env.speaker]   default port 8003
# ================================================================================================
[env.speaker]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
# Leave blank to auto-detect an output device from the keywords below
#SPEAKER_DEVICE_INDEX = ""
#SPEAKER_DEVICE_KEYWORDS = 'i2s,hw,default,sysdefault'

# ================================================================================================
# [env.stepper]   default port 8005
# ================================================================================================
[env.stepper]
# Computed by the deploy tool, not set here: SERVICE_HOST SERVICE_PORT
# Max speed constraint applied in the service layer if none provided (Steps per second)
#DEFAULT_SPEED_LIMIT = 1000.0
# Set to 1 to force the Mock Adapter even on a Raspberry Pi (services.toml presets MOCK_HARDWARE=1)
#MOCK_HARDWARE = 1
# Stepper Configuration (JSON) Define your steppers here with step, dir, and en pins (BCM numbering).
#STEPPER_CONFIGS = '{"stepper_1": {"step": 17, "dir": 27, "en": 5}, "stepper_2": {"step": 23, "dir": 24, "en": 25}}'
# Steps per full motor revolution (full steps x microsteps). Used by /rotate to convert "rotations" -> steps
# and "rpm" -> steps per second. Example: 1.8 deg/step motor = 200 full steps; with 1/8 ...
#STEPS_PER_REVOLUTION = 400

# ================================================================================================
# [env.ai-agent]   default port 7998
# ================================================================================================
[env.ai-agent]
# Computed by the deploy tool, not set here: AI_AGENT_HOST AI_AGENT_PORT
# The agent is available only when at least one provider key below, or OLLAMA_URL, is set.
# 1 = skip project manager, safety gate and action execution for a plain reply triage classifies as pure
# information/conversation (not a task to plan); 0 = always run the full pipeline
#AI_AGENT_FAST_PATH_ENABLED = 1
# exchanges (user message + reply) remembered per session
#AI_AGENT_HISTORY_TURNS = 6
# tries (the first included) of a failed LLM call, MCP tool or `retry` answer
#AI_AGENT_MAX_ATTEMPTS = 3
# another file with the model choice per step (profiles)
#AI_AGENT_MODELS_FILE = ""
# model id for phase 1, wins over the models file (triage)
#AI_AGENT_MODEL_PHASE_1 = ""
# model id for phase 2, wins over the models file (project manager)
#AI_AGENT_MODEL_PHASE_2 = ""
# model id for phase 20, wins over the models file (motion planner, the movement agent)
#AI_AGENT_MODEL_PHASE_20 = ""
# model id for phase 3, wins over the models file (safety gate)
#AI_AGENT_MODEL_PHASE_3 = ""
# model id for phase 4, wins over the models file (worker)
#AI_AGENT_MODEL_PHASE_4 = ""
# model id for phase 5, wins over the models file (MCP operator)
#AI_AGENT_MODEL_PHASE_5 = ""
# model id for phase 6, wins over the models file (data engineer)
#AI_AGENT_MODEL_PHASE_6 = ""
# model id for phase 7, wins over the models file (draft writer)
#AI_AGENT_MODEL_PHASE_7 = ""
# model id for phase 8, wins over the models file (editor in chief)
#AI_AGENT_MODEL_PHASE_8 = ""
# model id for phase 9, wins over the models file (answer checker)
#AI_AGENT_MODEL_PHASE_9 = ""
# model id for phase 99, wins over the models file (clarification)
#AI_AGENT_MODEL_PHASE_99 = ""
# independent actions of a plan that may run at the same time (1 = one by one). 6 cut a 30-step plan from 58 s
# to 23 s on Google; keep 1 on Groq (8,000 tokens/minute)
#AI_AGENT_PARALLEL_ACTIONS = 1
# 1 = auto-reload for development, 0 for a stable run (services.toml presets AI_AGENT_RELOAD=0)
#AI_AGENT_RELOAD = 0
ANTHROPIC_API_KEY = ""
COHERE_API_KEY = ""
#COHERE_URL = ""
# alias of GITHUB_PAT
GITHUB_API_KEY = ""
# GitHub Models token. The phases use GitHub Models by default, but that service is being retired.
GITHUB_PAT = ""
#GITHUB_URL = ""
GOOGLE_API_KEY = ""
# (services.toml presets GOOGLE_URL=https://generativelanguage.googleapis.com/v1beta/openai/)
#GOOGLE_URL = 'https://generativelanguage.googleapis.com/v1beta/openai/'
GROQ_API_KEY = ""
# (services.toml presets GROQ_URL=https://api.groq.com/openai/v1)
#GROQ_URL = 'https://api.groq.com/openai/v1'
# empty = https://cloud.langfuse.com (EU). US: https://us.cloud.langfuse.com
#LANGFUSE_HOST = ""
# Create a free project at https://cloud.langfuse.com and copy its API keys. Only metadata is sent, never
# prompts or answers.
LANGFUSE_PUBLIC_KEY = ""
LANGFUSE_SECRET_KEY = ""
MISTRAL_API_KEY = ""
#MISTRAL_URL = ""
#OLLAMA_URL = ""
